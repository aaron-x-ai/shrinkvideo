version: 1

defaults:
  codec: auto
  quality: balanced
  # ShrinkMaster 高级设置默认 1080p：1920:-2（见 dev_docs/ShrinkVideo开发实践 §11）
  resolution: "1920:-2"
  overwrite: false
  suffix: "_s"

# 主场景：原视频放入 staging_dir，飞书/Hermes「开始视频压缩」→ 一次扫描（无目录监听）
inbox:
  enabled: true
  title: 视频压缩中转
  staging_dir: /Users/mac/Downloads/shrinkvideo_work
  output_dir: /Users/mac/Downloads/shrinkvideo_work/done
  glob: "*.{mp4,mov,mkv,avi,webm,m4v,ts,mts}"
  include_subdirs: false
  continue_on_error: true
  after_success: keep
  archive_subdir: .processed

bin:
  dir: null

jobs: []

advanced:
  max_parallel: 1
  state_file: ~/.config/shrinkvideo/inbox-state.json
  min_output_bytes: 65536
  min_output_ratio: 0.01
  temp_dir: null
