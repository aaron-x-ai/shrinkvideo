version: 1

defaults:
  codec: auto
  quality: balanced
  resolution: null
  overwrite: false
  suffix: "_shrunk"

bin:
  dir: null

jobs:
  - id: default
    enabled: false
    title: 默认批处理（请用 easy-config 或手工编辑开启）
    input_dir: ~/Downloads
    output_dir: ~/Downloads/ShrinkVideo
    glob: "*.{mp4,mov,mkv,heic,jpg,jpeg,png}"
    include_images: true
    continue_on_error: true
    schedule:
      enabled: false
      cron: "0 2 * * *"
    notify: false

advanced:
  max_parallel: 1
  keep_metadata: false
  temp_dir: null
